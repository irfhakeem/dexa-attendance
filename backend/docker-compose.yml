services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dexa_api
    ports:
      - ${EXTERNAL_PORT:-8000}:${INTERNAL_PORT:-8000}
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-admin123}@mysql:3306/${MYSQL_DATABASE:-dexa_db}
      - RUSTFS_ENDPOINT=http://rustfs:9000
    depends_on:
      - mysql
      - rustfs

  mysql:
    image: mysql:latest
    container_name: dexa_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-admin123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dexa_db}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql

  rustfs:
    image: rustfs/rustfs:latest
    container_name: dexa_rustfs
    ports:
      - ${RUSTFS_API_PORT:-9000}:9000
      - ${RUSTFS_CONSOLE_PORT:-9001}:9001
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-admin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-admin123}
      - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - rustfs_data:/data
    command: /data

volumes:
  mysql_data:
  rustfs_data:
